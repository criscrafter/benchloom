name: Release

# Builds the downloads, Benchloom-<version>-windows-x64.zip and
# Benchloom-<version>-linux-x86_64.tar.gz, runs their self-tests and publishes them.
# For a pushed version tag (v1.2.3) it creates the release itself, with notes from
# the version's section in CHANGELOG.md, so nothing needs editing by hand, and then
# uploads the Python package to PyPI. Run by hand (Actions -> Release ->
# Run workflow), it only re-attaches the downloads to an existing release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the downloads to, for example v0.1.0"
        required: true

permissions:
  contents: write  # to upload the downloads to the release

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      matrix:
        # Linux on the oldest Ubuntu runner: the download needs its glibc (2.35) or newer
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Qt's system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3             libfontconfig1 libglib2.0-0 fonts-dejavu-core

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,usb,visa]" "pyinstaller>=6.10"

      - name: Build and self-test
        run: python packaging/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: download-${{ runner.os }}
          path: |
            build/Benchloom-*.zip
            build/Benchloom-*.tar.gz
          if-no-files-found: error

  publish:
    # One job for the release, after every download passed its self-test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          pattern: download-*
          path: downloads
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" downloads/* --clobber
          else
            python3 packaging/release_notes.py "$TAG" > notes.md
            gh release create "$TAG" downloads/*               --title "Benchloom ${TAG#v}" --notes-file notes.md --verify-tag --latest
          fi

  pypi:
    # PyPI trusts this workflow ("trusted publishing"), so no password or token is
    # stored anywhere. Only after the downloads passed their self-tests.
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/benchloom/
    permissions:
      id-token: write  # proves to PyPI that this is criscrafter/benchloom's workflow
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build the package
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
          test "$(ls dist/*.whl)" = "dist/benchloom-${GITHUB_REF_NAME#v}-py3-none-any.whl"

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
