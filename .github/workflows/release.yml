name: Windows download

# Builds Benchloom-<version>-windows-x64.zip, runs its self-test and attaches it to
# the GitHub release of the tag. Runs for every pushed version tag (v1.2.3), or by
# hand for an existing release: Actions -> Windows download -> Run workflow.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the download to, for example v0.1.0"
        required: true

permissions:
  contents: write  # to upload the zip to the release

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,usb]" "pyinstaller>=6.10"

      - name: Build and self-test
        run: python packaging/build_windows.py

      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "Benchloom ${TAG#v}" --draft \
              --notes "See CHANGELOG.md for what changed."
          fi
          gh release upload "$TAG" build/Benchloom-*-windows-x64.zip --clobber
