[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "benchloom"
dynamic = ["version", "readme"]  # from __init__.py and README.md, see below
description = "Open lab automation: wire up instruments visually or script them in Lua."
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "src/benchloom/templates/LICENSE.txt"]
authors = [{ name = "Friedrich-Christer Rosenthal" }]
keywords = [
    "lab automation", "test and measurement", "instrument control", "labview alternative",
    "scpi", "gpib", "oscilloscope", "power supply", "lua", "node editor",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Education",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Lua",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: System :: Hardware",
]
dependencies = [
    "lupa>=2.0",
    "pyserial>=3.5",
]

[project.optional-dependencies]
# GPIB / USB-TMC / LAN instruments through VISA. pyvisa-py is the pure-Python
# backend; vendor backends (NI-VISA, Keysight IO Libraries) are picked up
# automatically when installed but are never required.
visa = ["pyvisa>=1.13", "pyvisa-py>=0.7"]
# USBTMC instruments and USB-GPIB adapters such as xyphro UsbGpib, without a
# vendor VISA. libusb-package ships the libusb library for Windows and macOS.
usb = ["python-usbtmc>=0.8", "pyusb>=1.2", "libusb-package>=1.0.26"]
# The desktop app. Optional so the engine can run headless on small machines.
gui = ["PySide6>=6.6", "pyqtgraph>=0.13"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/criscrafter/benchloom"
Documentation = "https://github.com/criscrafter/benchloom#readme"
Issues = "https://github.com/criscrafter/benchloom/issues"
Changelog = "https://github.com/criscrafter/benchloom/blob/main/CHANGELOG.md"

[project.scripts]
benchloom = "benchloom.cli:main"

[project.gui-scripts]
benchloom-gui = "benchloom.gui:main"

[tool.hatch.version]
path = "src/benchloom/__init__.py"

# PyPI shows the README too, but not the files next to it: there its relative
# links and images point to GitHub instead.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(!\[[^\]]*\])\((docs/images/[^)]+)\)'
replacement = '\1(https://raw.githubusercontent.com/criscrafter/benchloom/main/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)]+)\)'
replacement = '](https://github.com/criscrafter/benchloom/blob/main/\1)'

[tool.hatch.build.targets.wheel]
packages = ["src/benchloom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
