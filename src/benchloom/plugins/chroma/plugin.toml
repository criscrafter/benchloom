[plugin]
id = "chroma"
name = "Chroma"
version = "0.1.0"
description = "Chroma ATE instruments."

[[device]]
id = "6404"
name = "Chroma 6404 AC source"
description = """375 VA programmable AC source: 0-150/300 V, 45-500 Hz, with GPIB or \
RS-232 (optional interface board). Over RS-232 use the baud rate and parity set on the \
front panel (2400-19200 baud); the manual names RTS/CTS as signals in use, so add \
`rtscts=1` to the resource if the cable carries them. Switches the output off when a \
test ends unless `leave_output_on = true`."""
driver = "chroma6404:Chroma6404"
simulator = "chroma6404:Chroma6404Sim"
transports = ["usbtmc", "prologix", "visa", "serial", "sim"]
default_name = "ac"

[[device.setting]]
name = "leave_output_on"
label = "Leave the output on after a test"
type = "bool"
default = false

[[device.setting]]
name = "check_errors"
label = "Check for errors after each setting"
type = "bool"
default = true
help = "Asks the instrument for errors after each setting; turn off only if it is too slow."
