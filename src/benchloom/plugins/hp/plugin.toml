[plugin]
id = "hp"
name = "HP / Agilent"
version = "0.1.0"
description = "Hewlett-Packard and Agilent instruments."
manufacturer = "HP"

[[device]]
id = "6655a"
name = "HP 6655A power supply"
description = """120 V / 4 A / 500 W single-output DC supply with GPIB and SCPI. \
Works with the other 665xA models too, within their own ratings. Switches the \
output off when a test ends unless `leave_output_on = true`."""
driver = "hp6655a:HP6655A"
simulator = "hp6655a:HP6655ASim"
transports = ["usbtmc", "prologix", "visa", "sim"]
default_name = "psu"
category = "psu"

[[device.setting]]
name = "leave_output_on"
label = "Leave the output on after a test"
type = "bool"
default = false

[[device.setting]]
name = "check_errors"
label = "Check for errors after each setting"
type = "bool"
default = true
help = "Asks the instrument for errors after each setting; turn off only if it is too slow."

[[device]]
id = "3478a"
name = "HP 3478A multimeter"
description = """5½-digit bench multimeter with GPIB (pre-SCPI command set): DC/AC \
volts, DC/AC current, 2- and 4-wire resistance."""
driver = "hp3478a:HP3478A"
simulator = "hp3478a:HP3478ASim"
transports = ["usbtmc", "prologix", "visa", "sim"]
default_name = "dmm"
category = "dmm"

[[device.setting]]
name = "digits"
label = "Digits at the start"
type = "int"
default = 5
min = 3
max = 5

[[device]]
id = "53131a"
name = "HP 53131A universal counter"
description = """225 MHz two-channel counter with GPIB and SCPI (also the 53132A): frequency, period, ratio, time interval, phase, pulse width, duty cycle, rise and fall time, peak voltages, totalize. The gate time sets the resolution of frequency, period and ratio."""
driver = "hp53131a:HP53131A"
simulator = "hp53131a:HP53131ASim"
transports = ["usbtmc", "prologix", "visa", "sim"]
default_name = "counter"
category = "counter"

[[device.setting]]
name = "gate_time"
label = "Gate time at the start (s)"
type = "float"
default = 0.1
min = 0.001
max = 1000
help = "Longer gates give more digits on frequency, period and ratio."

[[device.setting]]
name = "check_errors"
label = "Check for errors after each setting"
type = "bool"
default = true
