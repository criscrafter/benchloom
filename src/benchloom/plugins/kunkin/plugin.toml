[plugin]
id = "kunkin"
name = "Kunkin"
version = "0.1.0"
description = "Kunkin electronic loads."
manufacturer = "Kunkin"

[[device]]
id = "kp184"
name = "Kunkin KP184 electronic load"
description = """150 V / 40 A / 400 W DC load, controlled over its RS-232 or RS-485 port \
(Modbus RTU, 9600 baud 8N1 by default). Several loads can share one RS-485 adapter: \
give each its own address on the load and in its device entry, with the same port. \
Switches the load input off when a test ends unless told not to."""
tested = "yes: a KP184 over RS-485 (FTDI adapter) and over RS-232 (CH340 adapter)"
driver = "driver:KP184"
simulator = "simulator:KP184Sim"
transports = ["serial", "tcp", "sim"]
default_name = "eload"
category = "load"

# Find devices: read the input state (register 0x010E) of the load at address 1, at
# the default 9600 baud 8N1, the read the driver's "is_input_on" sends. A read
# changes nothing. Loads at other addresses or speeds, or firmware that wants the
# CRC high byte first, are not found and are added by hand.
[device.discovery]
serial = { baud = 9600, query_hex = "01 03 01 0E 00 04 24 36", recognize = "driver:recognize" }

[[device.setting]]
name = "address"
label = "Modbus address"
type = "int"
default = 1
min = 1
max = 247
help = "Set on the load. Loads on one RS-485 bus need different addresses."

[[device.setting]]
name = "crc_high_byte_first"
label = "CRC high byte first"
type = "bool"
default = false
help = "Only if the load does not answer; some 2020+ firmware is reported to need it."

[[device.setting]]
name = "leave_output_on"
label = "Leave the input on after a test"
type = "bool"
default = false
