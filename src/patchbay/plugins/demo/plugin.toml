[plugin]
id = "demo"
name = "Demo instruments"
version = "0.1.0"
description = "Simulated instruments for trying Patchbay without hardware. Also the reference example for plugin authors."

[[device]]
id = "psu"
name = "Demo power supply"
description = "A 20 V / 5 A bench supply feeding a 10 ohm load."
driver = "driver:DemoPsu"
simulator = "simulator:DemoPsuSim"
transports = ["sim"]
